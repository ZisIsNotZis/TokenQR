<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>TokenQR</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#eef2ff;font:15px system-ui}header{padding:22px 6%;background:#111a33;border-bottom:1px solid #263354}main{max-width:900px;margin:24px auto;padding:0 18px}.tabs{display:flex;gap:8px;margin-bottom:20px}.tabs button,.primary{border:0;border-radius:9px;padding:11px 18px;background:#263354;color:#cbd5ff;cursor:pointer}.tabs .on,.primary{background:#6366f1;color:#fff}.panel{background:#151e38;border:1px solid #29375d;border-radius:16px;padding:22px;margin-bottom:18px}input,textarea,select{width:100%;padding:11px;border-radius:8px;border:1px solid #34446d;background:#0d152b;color:#fff;margin:6px 0 12px}label{color:#aebbe0;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.hidden{display:none}.pill{display:inline-block;background:#263354;border-radius:20px;padding:4px 10px;margin:3px;font-size:12px}.modal{position:fixed;inset:0;background:#080c18eF;display:flex;align-items:center;justify-content:center;padding:20px}.modal.hidden{display:none}.modal>div{max-width:560px;width:100%;background:#17213e;border-radius:18px;padding:24px;box-shadow:0 20px 70px #000}.danger{color:#fda4af}.ok{color:#86efac}#qr{background:white;padding:14px;display:inline-block;margin:12px 0}pre{white-space:pre-wrap;color:#9fb0dc}.chat{min-height:260px;background:#0d152b;border-radius:10px;padding:14px;white-space:pre-wrap}.muted{color:#9aa8ca}button{font:inherit}</style><header><h1>TokenQR</h1><div class=muted>端到端 Token 授权 POC</div></header><main><div class=tabs><button id=receiverTab class=on>电脑端应用</button><button id=providerTab>Provider 手机端</button></div><section id=receiver><div class=panel id=request><h2>请求 Token</h2><p class=muted>电脑端生成一次性二维码，等待 Provider 授权。</p><div class=grid><div><label>应用名称</label><input id=app value="My AI Chat"></div><div><label>使用理由</label><input id=purpose value="个人 AI 对话"></div></div><div class=grid><div><label>有效期（分钟）</label><input id=ttl type=number value=30></div><div><label>Relay</label><input id=relay value="http://localhost:8765/relay"></div></div><button class=primary id=make>生成 Token QR</button><div id=qr></div><pre id=qrtext></pre><button class=primary id=wait disabled>等待授权</button></div><div class="panel hidden" id=chatPanel><h2><span class=ok>● 已扫码授权</span></h2><p id=sessionInfo class=muted></p><div class=chat id=chat></div><textarea id=msg placeholder="输入消息"></textarea><button class=primary id=ask>发送</button></div></section><section id=provider class=hidden><div class=panel><h2>Provider 配置</h2><p class=muted>配置一次，之后可为多个应用授权。</p><div id=providers></div><button class=primary id=addProvider>添加 Provider</button></div><div class="panel"><h2>扫描 Token QR</h2><button class=primary id=scan>使用摄像头扫描</button><video id=video playsinline class=hidden style="width:100%"></video><textarea id=code placeholder="也可以粘贴二维码内容"></textarea><button class=primary id=parse>继续</button></div></section></main><div id=modal class="modal hidden"><div><h2>确认授权</h2><div id=details></div><label>授权 Provider</label><select id=pick></select><label>授权有效期</label><select id=expiry><option>使用二维码指定期限</option><option>1 小时</option><option>1 天</option><option>7 天</option><option>30 天</option></select><label>限流（展示字段，POC 未强制）</label><input value="未配置 Gateway"><label>限量（展示字段，POC 未强制）</label><input value="未配置 Gateway"><label>允许模型</label><div id=models></div><button class=primary id=confirm>确认并发送</button><button id=cancel>取消</button></div></div><script src=vendor/qrcode.js></script><script>const $=x=>document.getElementById(x),j=x=>JSON.parse(x),b64=x=>btoa(String.fromCharCode(...new Uint8Array(x))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');let S=null,P=JSON.parse(localStorage.getItem('tqr.providers')||'[]');function save(){localStorage.setItem('tqr.providers',JSON.stringify(P));renderP()}function renderP(){let e=$('providers');e.innerHTML='';P.forEach((p,i)=>{let d=document.createElement('div');d.className='panel';d.innerHTML='<b>'+p.name+'</b><div class=muted>'+p.base+' · '+p.models.join(', ')+'</div><button data-i='+i+'>编辑</button> <button data-del='+i+'>删除</button>';e.append(d)});e.querySelectorAll('[data-del]').forEach(x=>x.onclick=()=>{P.splice(x.dataset.del,1);save()})}async function key(){return crypto.subtle.generateKey({name:'ECDH',namedCurve:'P-256'},true,['deriveKey'])}async function enc(pub,p){let k=await key(),raw=await crypto.subtle.exportKey('raw',k.publicKey),s=await crypto.subtle.deriveKey({name:'ECDH',public:pub},k.privateKey,{name:'AES-GCM',length:256},false,['encrypt']),iv=crypto.getRandomValues(new Uint8Array(12)),c=await crypto.subtle.encrypt({name:'AES-GCM',iv},s,new TextEncoder().encode(JSON.stringify(p)));return JSON.stringify({e:b64(raw),i:b64(iv),c:b64(c)})}function u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),x=>x.charCodeAt(0))}async function dec(priv,o){let ep=await crypto.subtle.importKey('raw',u(o.e),{name:'ECDH',namedCurve:'P-256'},false,[]),s=await crypto.subtle.deriveKey({name:'ECDH',public:ep},priv,{name:'AES-GCM',length:256},false,['decrypt']),x=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(o.i)},s,u(o.c));return j(new TextDecoder().decode(x))}function tab(a){$('receiver').classList.toggle('hidden',a!=='r');$('provider').classList.toggle('hidden',a!=='p');$('receiverTab').classList.toggle('on',a==='r');$('providerTab').classList.toggle('on',a==='p')}$('receiverTab').onclick=()=>tab('r');$('providerTab').onclick=()=>{renderP();tab('p')};$('addProvider').onclick=async()=>{let n=prompt('Provider 名称','OpenAI');if(!n)return;let base=prompt('Base URL','https://api.openai.com/v1'),token=prompt('Authorization Token');if(!base||!token)return;let models=[];try{let r=await fetch(base.replace(/\/$/,'')+'/models',{headers:{Authorization:token}});if(!r.ok)throw Error();let x=await r.json();models=(x.data||x.models||[]).map(m=>typeof m==='string'?m:m.id).filter(Boolean)}catch(e){let manual=prompt('无法自动读取模型（可能是 Provider CORS 限制）。请输入模型列表，用逗号分隔：','gpt-4o-mini');models=(manual||'').split(',').map(x=>x.trim()).filter(Boolean)}if(!models.length)return alert('至少需要一个模型');P.push({name:n,base,token,models});save()};$('make').onclick=async()=>{let k=await key(),id=crypto.randomUUID(),endpoint=$('relay').value+'/'+id;S={k,id,endpoint,expires:Date.now()+$('ttl').value*60000};let pub=await crypto.subtle.exportKey('raw',k.publicKey),q={v:'TQR1',r:endpoint,k:b64(pub),a:$('app').value,p:$('purpose').value,e:Math.floor(S.expires/1000)};$('qr').innerHTML='';QRCode.toCanvas(JSON.stringify(q),{width:300},(e,c)=>$('qr').append(c));$('qrtext').textContent=JSON.stringify(q);$('wait').disabled=false;$('wait').click()};$('wait').onclick=async()=>{$('wait').disabled=true;while(Date.now()<S.expires){let r=await fetch(S.endpoint);if(r.ok){let x=await r.json();if(x.body){try{let v=await dec(S.k.privateKey,j(x.body));S.v=v;$('request').classList.add('hidden');$('chatPanel').classList.remove('hidden');$('sessionInfo').textContent=v.provider+' / '+v.model;break}catch(e){alert('授权数据无效：'+e.message);console.error(e)}}}await new Promise(x=>setTimeout(x,1500))}};$('parse').onclick=()=>{try{let q=j($('code').value);if(q.v!=='TQR1'||q.e*1000<Date.now())throw Error('二维码无效或已过期');S=S||{};S.q=q;$('details').innerHTML='<p><b>应用：</b>'+q.a+'</p><p><b>理由：</b>'+q.p+'</p><p><b>有效期：</b>'+new Date(q.e*1000).toLocaleString()+'</p><p class=muted>限流、限量和模型限制为授权意图展示；无 Gateway 时不会被 Provider 强制执行。</p>';$('pick').innerHTML=P.map((p,i)=>'<option value='+i+'>'+p.name+'</option>').join('');$('models').innerHTML=(P[0]?.models||[]).map((x,i)=>'<label class=pill><input type=checkbox class=allow checked value="'+x+'"> '+x+'</label>').join('');$('modal').classList.remove('hidden')}catch(e){alert(e.message)}};$('cancel').onclick=()=> $('modal').classList.add('hidden');$('confirm').onclick=async()=>{let p=P[$('pick').value];if(!p)return alert('请先配置 Provider');let pub=await crypto.subtle.importKey('raw',u(S.q.k),{name:'ECDH',namedCurve:'P-256'},false,[]),m=await enc(pub,{a:S.q.a,p:S.q.p,provider:p.name,base:p.base,model:[...document.querySelectorAll('.allow:checked')].map(x=>x.value)[0]||p.models[0],allowed_models:[...document.querySelectorAll('.allow:checked')].map(x=>x.value),authorization:p.token,e:S.q.e});await fetch(S.q.r,{method:'POST',headers:{'Content-Type':'application/json'},body:m});$('modal').classList.add('hidden');alert('已发送授权')};$('ask').onclick=async()=>{let r=await fetch(S.v.base+'/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:S.v.authorization},body:JSON.stringify({model:S.v.model,messages:[{role:'user',content:$('msg').value}]})});$('chat').textContent+=JSON.stringify(await r.json())+'\n'};renderP();</script>
