<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>TokenQR Direct</title><style>body{font:16px system-ui;max-width:720px;margin:2rem auto;padding:0 1rem;background:#0b1020;color:#eef2ff}.panel{background:#17213e;padding:20px;border-radius:14px;margin:15px 0}input,textarea,button{font:inherit;padding:10px;margin:5px 0;width:100%;box-sizing:border-box;border-radius:7px;border:1px solid #40517d;background:#0d152b;color:white}button{background:#6366f1;border:0;cursor:pointer}#qr{background:white;padding:12px;display:inline-block}.muted{color:#aebbe0}</style><h1>TokenQR Direct</h1><p class=muted>无 Relay 的反向授权：Provider 生成加密二维码，接收方扫描后输入同一密码解密。</p><nav><button id=pt>Provider 端</button><button id=rt>接收方</button></nav><section id=provider class=panel><h2>Provider：生成二维码</h2><textarea id=data rows=6 placeholder="Provider、Base URL、模型、Token 等配置 JSON"></textarea><input id=pw type=password placeholder="设置一个好记但较长的密码"><button id=gen>生成加密二维码</button><div id=qr></div><p id=out class=muted></p></section><section id=receiver class="panel" hidden><h2>Receiver：扫描并解密</h2><button id=scan>使用相机扫描</button><video id=video playsinline hidden style="width:100%"></video><textarea id=code rows=5 placeholder="粘贴二维码内容"></textarea><input id=rpw type=password placeholder="输入 Provider 设置的密码"><button id=dec>扫描后解密</button><pre id=result></pre></section><script src=vendor/qrcode.js></script><script>const $=x=>document.getElementById(x),te=new TextEncoder(),td=new TextDecoder(),b=x=>btoa(String.fromCharCode(...new Uint8Array(x))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''),u=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),x=>x.charCodeAt(0))};async function derive(p,s){return crypto.subtle.deriveKey({name:'PBKDF2',salt:s,iterations:250000,hash:'SHA-256'},await crypto.subtle.importKey('raw',te.encode(p),'PBKDF2',false,['deriveKey']),{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}$('pt').onclick=()=>{$('provider').hidden=false;$('receiver').hidden=true};$('rt').onclick=()=>{$('provider').hidden=true;$('receiver').hidden=false};$('gen').onclick=async()=>{try{if($('pw').value.length<12)alert('建议密码至少 12 个字符，使用容易记忆的长短语');let s=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),k=await derive($('pw').value,s),c=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,te.encode($('data').value));let q=JSON.stringify({v:'TQD1',s:b(s),i:b(iv),c:b(c)});$('qr').innerHTML='';QRCode.toCanvas(q,{width:320,errorCorrectionLevel:'M'},(e,c)=>$('qr').append(c));$('out').textContent='二维码已生成。Provider 页面可以关闭；接收方需要此密码。'}catch(e){alert(e.message)}};$('dec').onclick=async()=>{try{let q=JSON.parse($('code').value);if(q.v!=='TQD1')throw Error('不是 TokenQR Direct 二维码');let k=await derive($('rpw').value,u(q.s)),x=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(q.i)},k,u(q.c));$('result').textContent=td.decode(x)}catch(e){$('result').textContent='解密失败：密码错误或二维码损坏'}};$('scan').onclick=async()=>{try{if(!('BarcodeDetector'in window))throw Error('浏览器不支持相机扫码，请粘贴二维码内容');let v=$('video');v.hidden=false;v.srcObject=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});await v.play();let d=new BarcodeDetector({formats:['qr_code']});let f=async()=>{let x=await d.detect(v);if(x.length){$('code').value=x[0].rawValue;v.srcObject.getTracks().forEach(t=>t.stop());v.hidden=true}else requestAnimationFrame(f)};f()}catch(e){alert(e.message)}};</script>
